<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Catalog Școlar - Autentificare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-3">Catalog Școlar</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email / Utilizator</label>
                <input type="email" name="username" class="form-control" placeholder="nume@scoala.ro" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Parolă</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">Autentificare</button>
            <a href="/register" class="btn btn-outline-success w-100 btn-sm">Creează cont nou</a>
        </form>
    </div>
</body>
</html>
