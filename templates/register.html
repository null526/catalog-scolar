<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Catalog Școlar - Înregistrare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 400px;">
        <h3 class="text-center mb-3">Creează Cont Nou</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email / Utilizator</label>
                <input type="email" name="username" class="form-control" placeholder="nume@scoala.ro" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Parolă</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Alege Rolul:</label>
                <select name="role" class="form-select">
                    <option value="elev">Elev</option>
                    <option value="parinte">Părinte</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-2">Trimite Cererea</button>
            <a href="/" class="btn btn-outline-secondary w-100 btn-sm">Înapoi la Autentificare</a>
        </form>
    </div>
</body>
</html>
